name: "Copilot Setup Steps"

# Prepares the environment for the Copilot coding agent in this fork.
# Purpose: check out the git submodules so the agent can read the dosing code and tests.
# Nothing here builds, runs or tests the project.
on:
  workflow_dispatch:          # manual test from the Actions tab
  pull_request:
    paths:
      - github/.Log_env_before_making_Agents.yml

jobs:
  # The job MUST be named `copilot-setup-steps` or Copilot will not pick it up.
  copilot-setup-steps:
    runs-on: ubuntu-latest    # Copilot coding agent supports Ubuntu x64 only
    permissions:
      contents: read          # needed for checkout
    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: List submodule status (read-only check)
        run: git submodule status
